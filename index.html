<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今天，慢慢來｜時間規劃</title><meta name="theme-color" content="#397b62"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="今天慢慢來"><style>
:root{--ink:#26342f;--muted:#77827c;--line:#e8ece8;--bg:#f7f8f5;--white:#fff;--green:#397b62;--mint:#e8f2ec;--amber:#b98234;--rose:#c46b64;--shadow:0 8px 28px #25382d0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:30px 26px 56px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.brand{font-size:17px;font-weight:700}.brand span{color:var(--green)}.today{color:var(--muted);font-size:13px}.hero{margin-bottom:22px}.eyebrow{font-size:11px;color:var(--green);font-weight:700;letter-spacing:.12em}.hero h1{font-size:30px;letter-spacing:-.03em;margin:5px 0}.hero p{margin:0;color:var(--muted)}.tabs{display:flex;gap:7px;margin-bottom:17px;overflow:auto}.tab{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 15px;color:var(--muted);white-space:nowrap}.tab.active{background:var(--green);border-color:var(--green);color:white}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.head{padding:18px 20px 13px;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.count{font-size:12px;color:var(--muted);background:#f2f4f1;border-radius:20px;padding:5px 10px}.form{padding:0 20px 15px;display:grid;grid-template-columns:1fr 100px 95px auto;gap:7px;border-bottom:1px solid var(--line)}input,select{border:1px solid #e2e7e2;border-radius:9px;padding:9px 10px;color:var(--ink);background:white;min-width:0}input:focus,select:focus{outline:2px solid #c6dfd0}.add{background:var(--green);color:white;border:0;border-radius:9px;padding:0 15px;font-weight:650}.tasks{padding:2px 12px 10px;max-height:460px;overflow:auto}.task{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid #f0f2ef}.task:last-child{border:0}.check{appearance:none;width:17px;height:17px;border:1.5px solid #cbd4cc;border-radius:50%;margin:0;cursor:pointer}.check:checked{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px white}.taskname{font-weight:550}.task.done .taskname{text-decoration:line-through;color:#9ba59e}.meta{display:flex;gap:7px;align-items:center;margin-top:3px;font-size:11px;color:var(--muted)}.tag{border-radius:5px;padding:2px 6px;background:#f2f4f1}.tag.high{background:#faece9;color:#aa544e}.tag.mid{background:#fbf2e4;color:#a66d24}.tag.low{background:#edf3ee;color:#5d8069}.del{border:0;background:transparent;color:#aab2ac;font-size:17px}.empty{text-align:center;padding:27px;color:var(--muted);font-size:13px}.barbg{margin:0 20px 16px;background:#f2f4f1;border-radius:7px;height:5px;overflow:hidden}.bar{height:100%;background:var(--green)}.timeline{padding:0 19px 6px}.slot{display:grid;grid-template-columns:49px 1fr;gap:10px;min-height:52px}.time{font-size:12px;color:#89938d;padding-top:9px}.slotbody{border-top:1px solid #edf0ed;padding:7px 9px}.slotbox{border-left:3px solid var(--green);background:var(--mint);border-radius:7px;padding:7px 9px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.slotbox small{color:#62816e;font-size:11px;white-space:nowrap}.break{border-left-color:#d6bd8b;background:#fbf6eb;color:#796843}.event{border-left-color:#c9796f;background:#fbefed}.slotbox input{width:58px;padding:4px 6px;font-size:12px}.slotbox button{border:0;background:none;color:#96a098;padding:0 3px}.timeline-tools{padding:1px 20px 12px}.addslot{width:100%;border:1px dashed #d9e1da;border-radius:8px;padding:8px;background:white;color:var(--muted);font-size:12px}.info{margin:3px 20px 17px;padding:12px 14px;background:#f0f4f0;border-radius:10px;color:#65736a;font-size:12px}.info strong{color:var(--ink)}.recipe{margin-top:17px;padding:17px 19px}.recipe h3{margin:0 0 6px;font-size:15px}.recipe p{font-size:13px;color:#647169;margin:0 0 7px}.recipe ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:#647169}.caption{color:#97a19a;font-size:11px;margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#273a31;color:white;padding:10px 16px;border-radius:9px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){body{font-size:16px}.app{padding:16px 12px calc(28px + env(safe-area-inset-bottom))}.top{margin-bottom:18px}.brand{font-size:16px}.today{font-size:12px}.hero{margin-bottom:16px}.hero h1{font-size:25px;line-height:1.28}.hero p{font-size:14px}.tabs{position:sticky;top:0;z-index:5;margin:0 -12px 13px;padding:8px 12px;background:#f7f8f5ed;backdrop-filter:blur(10px)}.tab{min-height:42px;padding:8px 13px}.layout{grid-template-columns:minmax(0,1fr);gap:13px}.layout>aside{order:0}.layout>section{order:1}.layout.later>section{order:0}.layout.later>aside{order:1}.card{border-radius:13px}.head{padding:15px 15px 11px}.head h2{font-size:16px}.sub{font-size:12px;line-height:1.4}.form{grid-template-columns:minmax(0,1fr) 78px;gap:7px;padding:0 12px 12px}.form input:first-child{grid-column:1;grid-row:1;min-height:44px;font-size:16px}.form .add{grid-column:2;grid-row:1;min-height:44px;padding:0 10px}.form #priority{grid-column:1;grid-row:2;min-height:42px}.form #duration{grid-column:2;grid-row:2;min-height:42px;padding:8px 6px}.tasks{max-height:none;padding:2px 10px 8px}.task{padding:13px 7px;gap:9px}.taskname{font-size:14px;line-height:1.4}.check{width:20px;height:20px}.del{font-size:21px;min-width:36px;min-height:40px}.barbg{margin:0 14px 14px}.timeline{padding:0 12px 5px}.slot{grid-template-columns:46px minmax(0,1fr);gap:7px;min-height:50px}.slotbox{align-items:flex-start;padding:8px;line-height:1.35;font-size:13px}.slotbox small{font-size:10px;padding-top:1px}.slotbox button{font-size:18px;min-width:28px;min-height:28px}.time{padding-top:9px}.timeline-tools{padding:3px 13px 11px}.addslot{min-height:43px}.info{margin:3px 13px 13px;padding:12px;font-size:12px;line-height:1.55}.recipe{margin-top:13px;padding:15px}.recipe p{line-height:1.5}.recipe li{margin:5px 0;line-height:1.5}.caption{line-height:1.5}} </style></head><body><main class="app"><header class="top"><div class="brand">◒ <span>今天，慢慢來</span></div><div class="today" id="date"></div></header><section class="hero"><div class="eyebrow">YOUR DAY, AT YOUR PACE</div><h1 id="headline">先把今天理清楚。</h1><p id="lead">把腦中的事放下來，再挑一件開始就好。</p></section><nav class="tabs"><button class="tab active" data-view="today">今天 · 10/24</button><button class="tab" data-view="tomorrow">明天 · 10/25</button><button class="tab" data-view="later">近期待辦</button></nav><div class="layout"><section class="card"><div class="head"><div><h2 id="taskTitle">今天要做</h2><div class="sub" id="taskSub">行程已先放好，留點空白給自己</div></div><span class="count" id="count"></span></div><form class="form" id="form"><input id="name" placeholder="新增一件待辦…" maxlength="100" required aria-label="待辦事項"><select id="priority" aria-label="優先順序"><option value="high">重要</option><option value="mid" selected>一般</option><option value="low">有空再做</option></select><select id="duration" aria-label="預估時間"><option value="15">15 分</option><option value="30" selected>30 分</option><option value="60">1 小時</option><option value="90">1.5 小時</option><option value="120">2 小時</option></select><button class="add">新增</button></form><div class="tasks" id="tasks"></div><div class="barbg"><div class="bar" id="bar"></div></div></section><aside><section class="card"><div class="head"><div><h2 id="planTitle">今天的固定行程</h2><div class="sub" id="planSub">點時間可調整；委託結束時間未定</div></div><button id="reset" style="border:0;background:none;color:#909a92;font-size:12px">重設</button></div><div class="timeline" id="timeline"></div><div class="timeline-tools"><button class="addslot" id="addslot">＋ 加一個時段</button></div><div class="info" id="tip"></div></section><section class="card recipe" id="recipe"><h3>留一點彈性</h3><p>先把重要的行程放好，其餘時間依當天狀況調整。</p></section></aside></div><div class="caption" style="text-align:center;margin-top:17px">安排保存在此瀏覽器 · Google 日曆尚未連接，可先開日曆對照</div></main><div class="toast" id="toast"></div><script>
const KEY='slowday-v1';let old=JSON.parse(localStorage.getItem(KEY)||'null');const seedTasks=[];const todayPlan=[];const tomorrowPlan=[];let state={tasks:old?.tasks||[],plans:old?.plans||{}};for(const t of state.tasks)if(!t.due)t.due='近期';for(const t of seedTasks)if(!state.tasks.some(x=>x.name===t.name))state.tasks.push({...t,done:false});if(!state.plans.today)state.plans.today=todayPlan;if(!state.plans.tomorrow)state.plans.tomorrow=tomorrowPlan;if(!state.plans.later)state.plans.later=[];let view='today';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#date').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'long'}).format(new Date());function rows(){return state.tasks.filter(t=>view==='later'?t.due==='近期':t.due===view)}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const cfg={today:['先把今天理清楚。','今天先安排一兩件重要的事，其他時間留給休息。','今天要做','今天的行程'],tomorrow:['明天留一點空間給彼此。','先安排最重要的活動，再替休息和彈性留一點時間。','明天要做','明天的行程'],later:['很多事先拆小，不用一次解決。','先從有期限或拖最久的開始；每次只挑一到兩項。','近期待辦','考試與作業分段處理']}[view];$('#headline').textContent=cfg[0];$('#lead').textContent=cfg[1];$('#taskTitle').textContent=cfg[2];$('#taskSub').textContent=cfg[3];$('#planTitle').textContent=view==='tomorrow'?'明天的約會安排':view==='today'?'今天的固定行程':'近期安排';$('#planSub').textContent=view==='today'?'行程之間留些空檔，避免安排太滿':view==='tomorrow'?'重要活動優先，其餘留彈性':'有明確日期後再移進行事曆';$('#recipe').style.display=view==='tomorrow'?'block':'none';$('#reset').style.display=view==='later'?'none':'block';$('#tip').innerHTML=view==='today'?'<strong>今天的建議</strong>　如果今天已經排得很滿，就先不加新任務；有空時挑一件小事做即可。':view==='tomorrow'?'<strong>錄影小檢查</strong>　替重要活動預留準備時間，也確認需要的物品都已備妥。':'<strong>小提醒</strong>　先挑一件最重要的待辦開始，完成一小步就算有進度。';const list=rows();$('#count').textContent=`${list.filter(t=>!t.done).length} 件未完成`;// render lists, grouped by importance
const ordered=[...list].sort((a,b)=>({high:0,mid:1,low:2}[a.priority]||0)-({high:0,mid:1,low:2}[b.priority]||0));$('#tasks').innerHTML=ordered.length?ordered.map(t=>{const i=state.tasks.indexOf(t);return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-check="${i}" ${t.done?'checked':''}><div><div class="taskname">${esc(t.name)}</div><div class="meta"><span class="tag ${t.priority}">${{high:'重要',mid:'一般',low:'有空再做'}[t.priority]||'一般'}</span><span>${t.duration>=60?`${t.duration/60} 小時`:`${t.duration} 分鐘`}</span></div></div><button class="del" data-del="${i}">×</button></div>`}).join(''):'<div class="empty">目前沒有待辦，先喘口氣吧。</div>';const d=list.filter(t=>t.done).length;$('#bar').style.width=list.length?`${d/list.length*100}%`:'0';const slots=state.plans[view]||[];$('#timeline').innerHTML=slots.map((s,i)=>`<div class="slot"><div class="time">${esc(s.time)}</div><div class="slotbody"><div class="slotbox ${s.kind==='break'?'break':''} ${s.kind==='event'?'event':''}"><span>${esc(s.title)}</span><small>${esc(s.duration)}</small><button data-delslot="${i}" title="移除">×</button></div></div></div>`).join('')||'<div class="empty">尚未安排時段。</div>';document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.tasks[+el.dataset.check].done=el.checked;save();render()});document.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{state.tasks.splice(+el.dataset.del,1);save();render()});document.querySelectorAll('[data-delslot]').forEach(el=>el.onclick=()=>{state.plans[view].splice(+el.dataset.delslot,1);save();render()})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#form').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim();if(!name)return;state.tasks.push({name,priority:$('#priority').value,duration:+$('#duration').value,done:false,due:view==='later'?'近期':view});save();render();$('#name').value='';$('#name').focus()};$('#addslot').onclick=()=>{const time=prompt('開始時間（例如 14:00）');if(!time)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){toast('請輸入 24 小時制時間，例如 14:00');return}const title=prompt('這段時間要做什麼？');if(!title?.trim())return;const duration=prompt('預計多久？（例如 30 分鐘、約 1 小時）','30 分鐘');state.plans[view].push({time,title:title.trim(),kind:'task',duration:duration||'彈性'});state.plans[view].sort((a,b)=>a.time.localeCompare(b.time));save();render()};$('#reset').onclick=()=>{state.plans[view]=view==='today'?[...todayPlan]:[...tomorrowPlan];save();render();toast('已恢復建議安排')};let timer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}save();render();if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script></body></html>
